[project]
name = "wechat-feed"
version = "0.9.8"
description = "技术瓜群流：本机微信群消息信息流"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "sqlcipher3-wheels>=0.5.4",
    "uvicorn>=0.32.0",
    "zstandard>=0.23.0",
]

[project.scripts]
wechat-feed = "wechat_feed.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
